---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Apache, PHP and MySQL PHP module
  ansible.builtin.apt:
    name: "{{ web_packages }}"
    state: present
  notify: Restart apache

- name: Create index page
  ansible.builtin.copy:
    dest: "{{ web_document_root }}/index.html"
    owner: "{{ web_owner }}"
    group: "{{ web_group }}"
    mode: "0644"
    content: |
      <html>
      <head><title>{{ web_index_title }}</title></head>
      <body>
        <h1>{{ web_index_title }}</h1>
        <p>Hostname: {{ inventory_hostname }}</p>
        <p>Role: {{ server_role }}</p>
      </body>
      </html>
  notify: Reload apache

- name: Create PHP test page
  ansible.builtin.copy:
    dest: "{{ web_document_root }}/{{ php_test_file }}"
    owner: "{{ web_owner }}"
    group: "{{ web_group }}"
    mode: "0644"
    content: "<?php phpinfo(); ?>"
  notify: Reload apache

- name: Ensure Apache is enabled and running
  ansible.builtin.service:
    name: "{{ apache_service_name }}"
    state: started
    enabled: true
