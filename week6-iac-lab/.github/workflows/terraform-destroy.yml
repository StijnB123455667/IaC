name: Terraform destroy

on:
  workflow_dispatch:

jobs:
  destroy:
    # Use a self-hosted runner that has the terraform.tfvars file and network access to ESXi.
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy
        run: terraform destroy -auto-approve
