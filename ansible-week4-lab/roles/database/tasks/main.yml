---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install MySQL packages
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
  notify: Restart mysql

- name: Configure MySQL bind address
  ansible.builtin.lineinfile:
    path: "{{ mysql_config_file }}"
    regexp: '^bind-address\s*='
    line: "bind-address = {{ mysql_bind_address }}"
    backup: true
  notify: Restart mysql

- name: Ensure MySQL is enabled and running
  ansible.builtin.service:
    name: "{{ mysql_service_name }}"
    state: started
    enabled: true

- name: Create application database
  community.mysql.mysql_db:
    name: "{{ mysql_database_name }}"
    state: present
    login_unix_socket: "{{ mysql_root_login_unix_socket }}"

- name: Create MySQL user dbuser with password dbpassword
  community.mysql.mysql_user:
    name: "{{ mysql_user_name }}"
    password: "{{ mysql_user_password }}"
    priv: "{{ mysql_database_name }}.*:ALL"
    host: "{{ mysql_allowed_host }}"
    state: present
    login_unix_socket: "{{ mysql_root_login_unix_socket }}"
  notify: Restart mysql
